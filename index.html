<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Buscador de Clientes - SGD</title>
    
    <!-- Librería para leer el Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.5/xlsx.full.min.js"></script>
    
    <style>
        :root {
            --primary-color: #2980b9;
            --success-color: #27ae60;
            --bg-color: #f5f7fa;
            --text-color: #2c3e50;
        }
        
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 15px;
            color: var(--text-color);
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 22px;
            margin-bottom: 5px;
            color: #1a252f;
        }
        
        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 20px;
        }

        .status-box {
            background-color: #e8f4fd;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            border: 2px dashed var(--primary-color);
            font-size: 15px;
        }

        .search-container {
            position: sticky;
            top: 0;
            background-color: var(--bg-color);
            padding: 10px 0;
            z-index: 100;
        }

        input[type="number"] {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #bdc3c7;
            border-radius: 10px;
            outline: none;
            background-color: white;
            transition: border-color 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            -moz-appearance: textfield;
            appearance: textfield;
        }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"]:focus {
            border-color: var(--primary-color);
        }

        input[type="number"]:disabled {
            background-color: #e0e0e0;
            cursor: not-allowed;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card h2 {
            margin-top: 0;
            font-size: 18px;
            color: var(--text-color);
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
            line-height: 1.3;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .info-item {
            font-size: 15px;
            line-height: 1.4;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 8px;
        }

        .info-item strong {
            color: #34495e;
            display: inline-block;
            width: 110px;
        }

        .btn-maps {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--success-color);
            color: white;
            padding: 15px;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 3px 6px rgba(39, 174, 96, 0.3);
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-maps:active {
            background-color: #219150;
            transform: scale(0.98);
        }

        .btn-maps svg {
            margin-right: 10px;
            width: 24px;
            height: 24px;
        }

        .btn-maps.disabled {
            background-color: #95a5a6;
            pointer-events: none;
            box-shadow: none;
        }

        .no-results {
            text-align: center;
            padding: 30px 20px;
            background-color: white;
            border-radius: 10px;
            color: #e74c3c;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Buscador de Clientes</h1>
        <div class="subtitle">Base de datos: Maria Grande 2026</div>
        
        <div class="status-box" id="statusBox">
            <span id="statusText">⏳ Descargando datos... Por favor, espera.</span>
        </div>

        <div class="search-container">
            <input type="number" id="searchInput" placeholder="Ingresa el NIS (Ej: 7512398)" oninput="buscarCliente()" disabled>
        </div>

        <div id="resultados">
            <div style="text-align: center; color: #7f8c8d; margin-top: 20px;">
                <p>Esperando a que los datos se carguen...</p>
            </div>
        </div>
    </div>

    <script>
        let clientes = [];

        // ✅ RUTA LOCAL: Busca el archivo Excel en la misma carpeta que este index.html
        const EXCEL_URL = 'Clientes%20con%20coordenadas-Maria%20Grande%202026.xlsx';

        async function cargarDatosDesdeGitHub() {
            try {
                const response = await fetch(EXCEL_URL);
                
                if (!response.ok) {
                    throw new Error("No se pudo descargar el archivo Excel. Verifica que esté subido en esta misma carpeta.");
                }
                
                const arrayBuffer = await response.arrayBuffer();
                
                const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                const sheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[sheetName];
                
                clientes = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

                document.getElementById('statusText').innerHTML = `✅ <b>${clientes.length}</b> registros cargados correctamente.`;
                document.getElementById('statusText').parentElement.style.backgroundColor = "#d4edda";
                document.getElementById('statusText').parentElement.style.borderColor = "#c3e6cb";
                document.getElementById('statusText').style.color = "#155724";
                
                const searchInput = document.getElementById('searchInput');
                searchInput.disabled = false;
                
                document.getElementById('resultados').innerHTML = `
                    <div style="text-align: center; color: #27ae60; font-weight: bold; margin-top:20px;">
                        <p>Listo. Ingresa un NIS arriba para buscar.</p>
                    </div>
                `;

            } catch (error) {
                console.error(error);
                document.getElementById('statusText').innerHTML = `❌ Error: ${error.message}`;
                document.getElementById('statusText').parentElement.style.backgroundColor = "#f8d7da";
                document.getElementById('statusText').parentElement.style.borderColor = "#f5c6cb";
                document.getElementById('statusText').style.color = "#721c24";
            }
        }

        window.onload = cargarDatosDesdeGitHub;

        function buscarCliente() {
            const input = document.getElementById('searchInput').value.trim();
            const resultadosDiv = document.getElementById('resultados');
            
            if (input === '') {
                resultadosDiv.innerHTML = '';
                return;
            }

            const coincidencias = clientes.filter(c => String(c.NIS).trim() === input);

            if (coincidencias.length === 0) {
                resultadosDiv.innerHTML = `<div class="no-results">No se encontró ningún cliente con el NIS: ${input}</div>`;
                return;
            }

            let htmlResultados = '';
            
            coincidencias.forEach(cliente => {
                const lat = cliente['COORDENADA_LATITUD'] || '';
                const lng = cliente['COORDENADA_LONGITUD'] || '';
                
                let linkMaps = '#';
                let btnClass = 'btn-maps disabled';
                
                if (lat !== '' && lng !== '' && !isNaN(parseFloat(lat)) && !isNaN(parseFloat(lng))) {
                    linkMaps = `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
                    btnClass = 'btn-maps'; 
                }

                htmlResultados += `
                    <div class="card">
                        <h2>${cliente.NOMBRE || 'Sin Nombre'}</h2>
                        <div class="info-grid">
                            <div class="info-item"><strong>NIS:</strong> ${cliente.NIS}</div>
                            <div class="info-item"><strong>Medidor:</strong> ${cliente.Medidor || '-'}</div>
                            <div class="info-item"><strong>Dirección:</strong> ${cliente.DIRECCION || '-'}</div>
                            <div class="info-item"><strong>N° Puerta:</strong> ${cliente['N° PUERTA'] || '-'}</div>
                            <div class="info-item"><strong>SETD:</strong> ${cliente.SETD || '-'}</div>
                            <div class="info-item"><strong>Localidad:</strong> ${cliente.LOCALIDAD || '-'}</div>
                            <div class="info-item"><strong>Coordenadas:</strong> ${lat}, ${lng}</div>
                        </div>
                        
                        <a href="${linkMaps}" target="_blank" class="${btnClass}">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                                <circle cx="12" cy="10" r="3"></circle>
                            </svg>
                            Ver ubicación en Maps
                        </a>
                    </div>
                `;
            });

            resultadosDiv.innerHTML = htmlResultados;
        }
    </script>
</body>
</html>
