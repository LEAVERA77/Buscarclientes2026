<!DOCTYPE html> 
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Restringido</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        
        /* Pantalla de Login */
        .login-container {
            max-width: 400px; margin: 100px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center;
        }
        .login-container h2 { color: #2c3e50; margin-bottom: 20px; }
        .login-container input { width: 100%; box-sizing: border-box; padding: 12px; margin-bottom: 15px; border: 2px solid #bdc3c7; border-radius: 8px; font-size: 16px; outline: none; }
        .login-container input:focus { border-color: #3498db; }
        .login-container button { width: 100%; padding: 12px; background-color: #3498db; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        .login-container button:hover { background-color: #2980b9; }
        .error-msg { color: #e74c3c; font-size: 14px; margin-bottom: 15px; display: none; }

        /* Aplicación (Oculta por defecto) */
        #appContainer { display: none; max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 10px; }
        .status-container { text-align: center; margin-bottom: 20px; font-weight: bold; padding: 10px; border-radius: 8px; }
        .status-loading { background-color: #fcf3cf; color: #b7950b; }
        .status-success { background-color: #d5f5e3; color: #239b56; }
        .status-error { background-color: #fadbd8; color: #cb4335; }
        
        .search-container { position: relative; margin-bottom: 20px; }
        input[type="text"] { width: 100%; box-sizing: border-box; padding: 12px 15px; font-size: 16px; border: 2px solid #bdc3c7; border-radius: 8px; outline: none; }
        input[type="text"]:focus { border-color: #3498db; }
        input[type="text"]:disabled { background-color: #eee; cursor: not-allowed; }

        .suggestions-box { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid #ddd; border-radius: 0 0 8px 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); z-index: 1000; max-height: 250px; overflow-y: auto; display: none; }
        .suggestion-item { padding: 10px 15px; cursor: pointer; border-bottom: 1px solid #eee; font-size: 14px; }
        .suggestion-item:hover { background-color: #e8f4fd; }
        .suggestion-item strong { color: #2c3e50; }
        .suggestion-item span { color: #7f8c8d; font-size: 12px; margin-left: 10px; }
        
        .card { border: 1px solid #e0e0e0; border-radius: 10px; padding: 20px; margin-bottom: 15px; background-color: #fafafa; }
        .card h2 { margin-top: 0; color: #2c3e50; font-size: 18px; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        @media (max-width: 600px) { .info-grid { grid-template-columns: 1fr; } }
        .info-item { font-size: 14px; word-break: break-word; }
        .info-item strong { color: #555; }
        .btn-maps { display: inline-flex; align-items: center; background-color: #27ae60; color: white; padding: 10px 15px; text-decoration: none; border-radius: 6px; font-weight: bold; }
        .btn-maps:hover { background-color: #219150; }
        .btn-maps svg { margin-right: 8px; width: 20px; height: 20px; }
        .no-results { text-align: center; padding: 20px; color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>

    <!-- PANTALLA DE LOGIN -->
    <div class="login-container" id="loginScreen">
        <h2>Ingreso al Sistema</h2>
        <div id="loginError" class="error-msg">Usuario o contraseña incorrectos.</div>
        <input type="text" id="userInput" placeholder="Usuario" autocomplete="off">
        <input type="password" id="passInput" placeholder="Contraseña" autocomplete="off">
        <button onclick="verificarLogin()">Ingresar</button>
    </div>

    <!-- APLICACIÓN -->
    <div id="appContainer">
        <h1>Buscador de Clientes</h1>
        
        <div id="statusBox" class="status-container status-loading">⏳ Cargando base de datos de clientes...</div>

        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Ingresa NIS, Medidor o Nombre..." oninput="procesarEntrada()" onblur="ocultarSugerencias()" disabled autocomplete="off">
            <div id="suggestionsBox" class="suggestions-box"></div>
        </div>

        <div id="resultados">
            <div style="text-align: center; color: #7f8c8d;"><p>Esperando que carguen los datos...</p></div>
        </div>
    </div>

    <script>
        // 🔐 CONFIGURACIÓN DIRECTA (Sin Hash para evitar fallos)
        const USUARIO_VALIDO = "admin";
        const PASS_VALIDA = "enersamg2026"; 

        let clientes = [];
        const excelURL = './clientes.xlsx'; 
        let datosCargados = false;

        function verificarLogin() {
            const user = document.getElementById('userInput').value.trim();
            const pass = document.getElementById('passInput').value.trim();
            const errorMsg = document.getElementById('loginError');

            // Comparamos directamente el texto
            if (user === USUARIO_VALIDO && pass === PASS_VALIDA) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('appContainer').style.display = 'block';
                
                if (!datosCargados) {
                    cargarExcel();
                }
            } else {
                errorMsg.style.display = 'block';
                document.getElementById('passInput').value = '';
            }
        }

        document.getElementById('passInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') verificarLogin();
        });

        function cargarExcel() {
            fetch(excelURL)
                .then(response => {
                    if (!response.ok) throw new Error("No se pudo encontrar el archivo Excel.");
                    return response.arrayBuffer();
                })
                .then(data => {
                    const workbook = XLSX.read(data, { type: 'array' });
                    const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                    clientes = XLSX.utils.sheet_to_json(worksheet, { defval: "" });
                    
                    document.getElementById('statusBox').className = "status-container status-success";
                    document.getElementById('statusBox').innerHTML = `✅ Base de datos cargada (${clientes.length} registros).`;

                    const searchInput = document.getElementById('searchInput');
                    searchInput.disabled = false;
                    searchInput.focus();

                    document.getElementById('resultados').innerHTML = `
                        <div style="text-align: center; color: #27ae60; font-weight: bold;">
                            <p>Escribe un NIS, Medidor o Nombre para buscar.</p>
                        </div>
                    `;
                    datosCargados = true;
                })
                .catch(error => {
                    document.getElementById('statusBox').className = "status-container status-error";
                    document.getElementById('statusBox').innerHTML = `❌ Error al cargar la base de datos.`;
                });
        }

        // --- LÓGICA DEL BUSCADOR ---
        function normalizarTexto(texto) {
            return String(texto || '').toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
        }

        function distanciaLevenshtein(a, b) {
            if(a.length === 0) return b.length; 
            if(b.length === 0) return a.length; 
            let matriz = [];
            for(let i = 0; i <= b.length; i++) matriz[i] = [i];
            for(let j = 0; j <= a.length; j++) matriz[0][j] = j;
            for(let i = 1; i <= b.length; i++){
                for(let j = 1; j <= a.length; j++){
                    if(b.charAt(i-1) == a.charAt(j-1)) matriz[i][j] = matriz[i-1][j-1];
                    else matriz[i][j] = Math.min(matriz[i-1][j-1] + 1, Math.min(matriz[i][j-1] + 1, matriz[i-1][j] + 1));
                }
            }
            return matriz[b.length][a.length];
        }

        function procesarEntrada() {
            const input = document.getElementById('searchInput').value.trim();
            const suggestionsBox = document.getElementById('suggestionsBox');
            
            if (input === '') {
                ocultarSugerencias();
                document.getElementById('resultados').innerHTML = '<div style="text-align: center; color: #7f8c8d;"><p>Escribe un NIS, Medidor o Nombre para buscar.</p></div>';
                return;
            }

            if (/^\d+$/.test(input)) {
                ocultarSugerencias(); 
                buscarClienteExacto(input);
                return;
            }

            if (input.length >= 3) {
                generarSugerencias(input, suggestionsBox);
            } else {
                ocultarSugerencias();
                document.getElementById('resultados').innerHTML = '<div style="text-align: center; color: #7f8c8d;"><p>Sigue escribiendo para ver sugerencias...</p></div>';
            }
        }

        function generarSugerencias(input, suggestionsBox) {
            const inputNormalizado = normalizarTexto(input);
            const resultados = [];

            clientes.forEach(cliente => {
                const nombreOriginal = cliente.NOMBRE || '';
                const nombreNormalizado = normalizarTexto(nombreOriginal);

                if (nombreNormalizado.includes(inputNormalizado)) {
                    resultados.push({ cliente, distancia: 0, nombreOriginal });
                } else if (nombreNormalizado.length > 0) {
                    const distancia = distanciaLevenshtein(inputNormalizado, nombreNormalizado);
                    if (distancia <= Math.max(3, Math.floor(nombreNormalizado.length / 3))) {
                        resultados.push({ cliente, distancia, nombreOriginal });
                    }
                }
            });

            resultados.sort((a, b) => a.distancia - b.distancia);
            const topSugerencias = resultados.slice(0, 5);

            if (topSugerencias.length === 0) {
                suggestionsBox.innerHTML = '<div class="suggestion-item">No se encontraron nombres parecidos</div>';
                suggestionsBox.style.display = 'block';
                return;
            }

            suggestionsBox.innerHTML = '';
            topSugerencias.forEach(res => {
                const div = document.createElement('div');
                div.className = 'suggestion-item';
                div.innerHTML = `<strong>${res.nombreOriginal}</strong> <span>(NIS: ${res.cliente.NIS || '-'})</span>`;
                div.onmousedown = function(e) {
                    e.preventDefault();
                    document.getElementById('searchInput').value = res.nombreOriginal;
                    ocultarSugerencias();
                    mostrarTarjeta(res.cliente);
                };
                suggestionsBox.appendChild(div);
            });
            suggestionsBox.style.display = 'block';
        }

        function ocultarSugerencias() {
            document.getElementById('suggestionsBox').style.display = 'none';
        }

        function buscarClienteExacto(input) {
            const coincidencias = clientes.filter(c => {
                const nis = String(c.NIS || '').trim();
                const medidor = String(c.Medidor || '').trim();
                return nis === input || medidor === input;
            });

            const resultadosDiv = document.getElementById('resultados');
            resultadosDiv.innerHTML = '';

            if (coincidencias.length === 0) {
                resultadosDiv.innerHTML = `<div class="no-results">No se encontró ningún cliente con el NIS o Medidor: ${input}</div>`;
                return;
            }
            coincidencias.forEach(cliente => mostrarTarjeta(cliente, true));
        }

        function mostrarTarjeta(cliente, limpiarAntes = false) {
            const resultadosDiv = document.getElementById('resultados');
            if (limpiarAntes) resultadosDiv.innerHTML = '';

            const lat = cliente['COORDENADA_LATITUD'] || '';
            const lng = cliente['COORDENADA_LONGITUD'] || '';
            
            let linkMaps = '#';
            let btnDisabled = 'style="background-color: #95a5a6; pointer-events: none;"';
            if (lat !== '' && lng !== '' && !isNaN(parseFloat(lat)) && !isNaN(parseFloat(lng))) {
                linkMaps = `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
                btnDisabled = ''; 
            }

            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <h2>${cliente.NOMBRE || 'Sin Nombre'} <br><span style="font-size: 14px; color: #7f8c8d; font-weight: normal;">NIS: ${cliente.NIS || '-'} | Medidor: ${cliente.Medidor || '-'}</span></h2>
                <div class="info-grid">
                    <div class="info-item"><strong>Medidor:</strong> ${cliente.Medidor || '-'}</div>
                    <div class="info-item"><strong>Dirección:</strong> ${cliente.DIRECCION || '-'}</div>
                    <div class="info-item"><strong>N° Puerta:</strong> ${cliente['N° PUERTA'] || '-'}</div>
                    <div class="info-item"><strong>SETD:</strong> ${cliente.SETD || '-'}</div>
                    <div class="info-item"><strong>Localidad:</strong> ${cliente.LOCALIDAD || '-'}</div>
                    <div class="info-item"><strong>Coordenadas:</strong> ${lat && lng ? lat + ', ' + lng : 'No disponibles'}</div>
                </div>
                <a href="${linkMaps}" target="_blank" rel="noopener noreferrer" class="btn-maps" ${btnDisabled}>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                        <circle cx="12" cy="10" r="3"></circle>
                    </svg>
                    Ver en Google Maps
                </a>
            `;
            resultadosDiv.innerHTML = ''; 
            resultadosDiv.appendChild(card);
        }

        document.addEventListener('click', function(e) {
            const searchContainer = document.querySelector('.search-container');
            if (!searchContainer.contains(e.target)) ocultarSugerencias();
        });
    </script>
</body>
</html>
